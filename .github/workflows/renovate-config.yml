name: Renovate config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The prebuilt image rather than `pnpm dlx renovate`: Renovate's npm tree
      # fails this repo's trustPolicy. renovate.json's custom manager bumps the
      # tag and digest together. --strict also fails on config Renovate would
      # migrate.
      - name: Validate renovate.json
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/renovatebot/renovate:44.208.0@sha256:98c66dae501e5bd65e42236c6a79dcc416ad266d6c9b51e28d18c49684f3bb3f
          renovate-config-validator --strict
