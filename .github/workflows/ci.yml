name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs this run needs (scripts/ciChanges.mjs). Pushes to main
  # run everything. The jobs below run unless their output is exactly 'false',
  # so a missing output runs a job rather than skipping it.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      test: ${{ steps.changes.outputs.test }}
      build: ${{ steps.changes.outputs.build }}
      e2e_chrome: ${{ steps.changes.outputs.e2e_chrome }}
      e2e_firefox: ${{ steps.changes.outputs.e2e_firefox }}
    steps:
      # Depth 2 reaches the pull request merge commit's base-branch parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/ciChanges.mjs >> "$GITHUB_OUTPUT"
          else
            node scripts/ciChanges.mjs --all >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.test != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Reports without blocking: an advisory published overnight, usually in
      # a dev-only build tool, would otherwise stop every merge until cleared.
      # A red step still needs clearing -- see docs/toolchain.md.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      - name: Run tests
        run: pnpm test

  build:
    needs: changes
    if: needs.changes.outputs.build != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build extension for Chrome
        run: pnpm run build

      - name: Build extension for Firefox
        run: pnpm run build:firefox

      - name: Upload Chrome build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome
          path: dist/chrome/

      - name: Upload Firefox build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox
          path: dist/firefox/

  # The E2E jobs test the uploaded builds, not a rebuild of their own.
  e2e-chrome:
    needs: [changes, build]
    if: needs.changes.outputs.e2e_chrome != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Download Chrome build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome
          path: dist/chrome/

      # --with-deps apt-installs Chromium's system libraries; --no-shell skips
      # the headless shell, which can't load extensions and so is never
      # launched -- see docs/testing.md.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # Uses the runner image's Firefox and openssl (see docs/testing.md).
  e2e-firefox:
    needs: [changes, build]
    if: needs.changes.outputs.e2e_firefox != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Download Firefox build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firefox
          path: dist/firefox/

      # libavcodec is Firefox's H.264 decoder on Linux, for the MP4 test.
      - name: Install libavcodec
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libavcodec-extra

      - name: Run Firefox E2E tests
        timeout-minutes: 10
        run: |
          firefox --version
          pnpm run test:e2e:firefox

  # The one required check. It fails when a job in `needs` failed or was
  # cancelled; a job skipped because its paths didn't change passes, and one
  # skipped after a failure upstream is caught by that failure. A new job must
  # be added to `needs` or it never blocks a merge. always() keeps the gate
  # itself from being skipped, since a skipped required check counts as passing.
  ci:
    if: always()
    needs: [changes, test, build, e2e-chrome, e2e-firefox]
    runs-on: ubuntu-26.04
    steps:
      - name: Check no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in failure | cancelled) exit 1 ;; esac
          done
