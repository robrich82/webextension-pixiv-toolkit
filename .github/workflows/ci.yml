name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs this run needs (scripts/ciChanges.mjs). Pushes, and pull
  # requests into another PR's branch, run everything: retargeting a stacked PR
  # onto main doesn't rerun CI, so its last run has to have covered the code
  # below it. The jobs below run unless their output is exactly 'false', so a
  # missing output runs a job rather than skipping it.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      test: ${{ steps.changes.outputs.test }}
      build: ${{ steps.changes.outputs.build }}
      e2e_chrome: ${{ steps.changes.outputs.e2e_chrome }}
      e2e_firefox: ${{ steps.changes.outputs.e2e_firefox }}
      lint: ${{ steps.changes.outputs.lint }}
    steps:
      # Depth 2 reaches the pull request merge commit's base-branch parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # A change to the rules or this workflow runs everything, decided here
        # so that broken rules can't skip the tests that would catch them.
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE" = "$DEFAULT_BRANCH" ] &&
            git diff --quiet HEAD^1 HEAD -- scripts/ciChanges.mjs .github/workflows/ci.yml; then
            node scripts/ciChanges.mjs >> "$GITHUB_OUTPUT"
          else
            node scripts/ciChanges.mjs --all >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.test != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Reports without blocking: an advisory published overnight, usually in
      # a dev-only build tool, would otherwise stop every merge until cleared.
      # A red step still needs clearing -- see docs/toolchain.md.
      - name: Audit dependencies
        continue-on-error: true
        run: mise run audit

      - name: Run tests
        run: mise run test

  # Oxlint through Vite+ (vite.config.mjs); a warning fails it.
  lint:
    needs: changes
    if: needs.changes.outputs.lint != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Lint
        run: mise run lint

  build:
    needs: changes
    if: needs.changes.outputs.build != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build extension for Chrome
        run: mise run build

      - name: Build extension for Firefox
        run: mise run build:firefox

      - name: Upload Chrome build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome
          path: dist/chrome/

      - name: Upload Firefox build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox
          path: dist/firefox/

  # The E2E jobs test the uploaded builds, not a rebuild of their own.
  e2e-chrome:
    needs: [changes, build]
    if: needs.changes.outputs.e2e_chrome != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Download Chrome build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome
          path: dist/chrome/

      # --with-deps apt-installs Chromium's system libraries; --no-shell skips
      # the headless shell, which can't load extensions and so is never
      # launched -- see docs/testing.md.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium

      # --skip-deps: test the downloaded build rather than rebuild it.
      - name: Run E2E tests
        run: mise run --skip-deps test:e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # Uses the runner image's Firefox and openssl (see docs/testing.md).
  e2e-firefox:
    needs: [changes, build]
    if: needs.changes.outputs.e2e_firefox != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Download Firefox build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firefox
          path: dist/firefox/

      # libavcodec is Firefox's H.264 decoder on Linux, for the MP4 test.
      - name: Install libavcodec
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libavcodec-extra

      - name: Run Firefox E2E tests
        timeout-minutes: 10
        run: |
          firefox --version
          mise run --skip-deps test:e2e:firefox

  # The one required check: it fails if a job in `needs` failed or was
  # cancelled. A skipped job passes; a skip means unchanged paths or a failure
  # upstream, which `needs` already reports. Add every new job to `needs`.
  # always() stops the gate itself being skipped, since a skipped required
  # check counts as passing.
  ci:
    if: always()
    needs: [changes, test, lint, build, e2e-chrome, e2e-firefox]
    runs-on: ubuntu-26.04
    steps:
      - name: Check no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in failure | cancelled) exit 1 ;; esac
          done
