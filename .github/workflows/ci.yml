name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs Node from mise.toml and pnpm from `packageManager`, as locally.
      # No separate check against `engines`: pnpm enforces the root project's
      # `engines` on every install, so an out-of-range pin fails the install.
      # The default key ignores package.json, so it would miss a pnpm bump.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Locate pnpm store
        id: pnpm-store
        run: |
          path=$(pnpm store path --silent)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm denies dependency lifecycle scripts by default and fails the
      # install if a package wants to build without an entry in `allowBuilds`
      # (see pnpm-workspace.yaml, where every such package is denied).
      # That replaces the old `npm ci --ignore-scripts` flag with a default
      # that also protects local installs, not just this line of YAML.
      #
      # --frozen-lockfile is the `npm ci` equivalent: install exactly the
      # locked tree and fail if package.json and pnpm-lock.yaml disagree. It
      # also re-checks the locked versions against the supply-chain policies,
      # so the cooldown and trust settings still apply even though no
      # resolution happens here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reports without blocking: an advisory published overnight, usually in
      # a dev-only build tool, would otherwise stop every merge until cleared.
      # A red step still needs clearing -- see docs/toolchain.md.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      - name: Run tests
        run: pnpm test

      - name: Build extension for Chrome
        run: pnpm run build

      - name: Build extension for Firefox
        id: build-firefox
        run: pnpm run build:firefox

      - name: Upload Chrome build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome
          path: dist/chrome/

      - name: Upload Firefox build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox
          path: dist/firefox/

      # After the uploads, so a failing E2E run still leaves the builds to
      # debug with. --with-deps apt-installs Chromium's system libraries;
      # --no-shell skips the headless shell, which can't load extensions and
      # so is never launched -- see docs/testing.md.
      - name: Install Chromium for E2E
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      # Uses the runner image's Firefox and openssl (see docs/testing.md). Runs
      # even when the Chromium E2E fails, so a failure shows which browsers it hits.
      # libavcodec is Firefox's H.264 decoder on Linux, for the MP4 test.
      - name: Run Firefox E2E tests
        if: ${{ !cancelled() && steps.build-firefox.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libavcodec-extra
          firefox --version
          pnpm run test:e2e:firefox

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
