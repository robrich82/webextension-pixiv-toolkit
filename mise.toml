# The oldest release tested with this mise.lock; 2026.8.11 can't read it.
min_version = "2026.11.8"

[settings]
# Stops the per-install download ping to mise-versions.jdx.dev.
use_versions_host_track = false
# Overrides any global list naming pnpm: reading `packageManager` as well would
# add a second, npm:pnpm entry to mise.lock.
idiomatic_version_file_enable_tools = []
# `[deps]` below is experimental; without this, `mise exec` and `mise deps` error.
experimental = true

[tools]
node = "26.13.1"
# Must match `packageManager` in package.json; test/toolchainPins.spec.js checks.
pnpm = "12.23.0"

# `mise deps` runs this when its inputs changed or node_modules is missing
# (`mise deps pnpm --explain` lists them). `mise exec` and `mise run` do it
# first too; `mise install` doesn't.
[deps.pnpm]
auto = true
run = "pnpm install --frozen-lockfile"

# The commands; `mise tasks` lists them, and test/miseTasks.spec.js checks them.
[tasks.dev]
description = "Watch build for Chrome into dist/chrome; restart after editing src/statics or reinstalling dependencies"
run = "node scripts/build.mjs --watch"

[tasks."dev:firefox"]
description = "Watch build for Firefox into dist/firefox; restart after editing src/statics or reinstalling dependencies"
run = "node scripts/build.mjs --platform=firefox --watch"

[tasks.build]
description = "Production build for Chrome into dist/chrome"
run = "node scripts/build.mjs"

[tasks."build:firefox"]
description = "Production build for Firefox into dist/firefox"
run = "node scripts/build.mjs --platform=firefox"

[tasks.test]
description = "Vitest through Vite+, unit and components projects, with coverage thresholds"
run = "pnpm exec vp test run"

[tasks."test:e2e"]
description = "Playwright against a fresh dist/chrome"
depends = ["build"]
run = "pnpm exec playwright test"

[tasks."test:e2e:firefox"]
description = "node --test in real Firefox against a fresh dist/firefox (prerequisites: docs/testing.md, \"Firefox\")"
depends = ["build:firefox"]
run = 'node --test --test-reporter=spec "e2e-firefox/*.test.mjs"'

[tasks.audit]
description = "pnpm audit at the level CI reports"
run = "pnpm audit --audit-level=moderate"

[tasks."package:chrome"]
description = "Build and zip the Chrome Web Store upload into dist/"
run = "node scripts/package-chrome.mjs"

# AMO signs a version only once. The prompt guards against accidents, not
# agents: `--yes`, a truthy MISE_YES or CI, and the mise MCP server's
# run_task all answer it. Without a terminal or one of those, the task fails.
[tasks."release:firefox"]
description = "Build, sign through AMO and publish the Firefox release of package.json's version"
confirm = "Sign and publish this version? AMO signs a version only once."
run = "node scripts/release-firefox.js"
