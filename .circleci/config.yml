version: 2.1
jobs:
  build:
    working_directory: ~/webext-pixiv-toolkit
    docker:
      - image: cimg/node:24.20.0
    steps:
      - checkout
      - restore_cache: # special step to restore the dependency cache
          # Read about caching dependencies: https://circleci.com/docs/2.0/caching/
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: "Install npm packages"
          # --ignore-scripts: no dependency needs a build step here. The only
          # two that declare install scripts are leveldown (pouchdb's native
          # Node LevelDB binding) and @parcel/watcher (sass --watch); neither is
          # reachable, since pouchdb is a webpack external loaded from its
          # prebuilt browser bundle and watching is webpack's job. npm 11 blocks
          # these by default -- being explicit keeps the result the same across
          # npm versions and drops a well-worn supply-chain foothold.
          command: "npm ci --ignore-scripts"
      - save_cache: # special step to save the dependency cache
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: "Audit dependencies"
          # The only advisories left are the Vue 2 EOL ones, which are `low` and
          # cannot be cleared without the Vue 3 migration. Failing at `moderate`
          # keeps new problems from getting lost in that standing noise.
          command: "npm audit --audit-level=moderate"
      - run:
          name: "Run tests"
          command: "npm test"
      - run:
          name: "Build extension for Chrome"
          command: "npm run build"
      - run:
          name: "Build extension for Firefox"
          command: "npm run build:firefox"
      - run:
          name: "Create artifacts"
          command: |
            tar -cvzf ./chrome.tar.gz ./dist/chrome/
            tar -cvzf ./firefox.tar.gz ./dist/firefox/
      - store_artifacts:
          path: ./chrome.tar.gz
      - store_artifacts:
          path: ./firefox.tar.gz
