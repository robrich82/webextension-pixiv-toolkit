engineStrict: true

# --- Supply chain -----------------------------------------------------------
# Refuse packages published less than this many minutes ago. Caret ranges stop
# a plain install crossing a major, but they happily take a malicious patch the
# hour it lands -- which is the shape almost every compromised-maintainer
# incident has had. pnpm v11 defaults to 1440 (one day); this project is not
# release-driven and has no reason to be an early adopter of anything, so the
# window is a week. Set explicitly rather than inherited, so a future change to
# pnpm's default cannot quietly shorten it.
#
# A deliberate urgent security bump WILL appear to fail against this. The fix
# is `minimumReleaseAgeExclude`, not lowering the window -- see docs/toolchain.md.
#
# Setting this at all also turns on `minimumReleaseAgeStrict` (pnpm's default
# when the key is present, even at a value equal to the default): if nothing
# in range is old enough, the install fails loudly instead of silently taking
# an immature version. That is the wanted behaviour; ordinary fall-back to an
# older mature version is unaffected.
minimumReleaseAge: 10080

# The security-patch overrides below (image-size, adm-zip, serialize-javascript)
# landed within the cooldown window when added, so they need an explicit
# exclusion or the install fails outright. Remove each entry once
# minimumReleaseAge has elapsed since its publish date; the override in
# `overrides` below stays.
minimumReleaseAgeExclude:
  - 'adm-zip@0.6.1'
  - 'serialize-javascript@7.1.3'
  - 'image-size@2.0.3'

# Lifecycle scripts are denied by default in pnpm, and pnpm fails the install
# outright if a package wants to build and this map does not mention it. So the
# allowlist is really a decision log: every package in the tree that declares an
# install script is named here, and every one of them is denied.
#
#   leveldown        pouchdb's native LevelDB binding. Unreachable -- pouchdb is
#                    a webpack external loaded from its prebuilt browser bundle.
#   @parcel/watcher  native file watching for `sass --watch`. Unreachable --
#                    watching is webpack's job here.
#   unrs-resolver    jest-resolve's native resolver. Its script only verifies
#                    that the right `@unrs/resolver-binding-*` optional
#                    dependency got installed; the binary itself arrives
#                    prebuilt, so skipping the check costs nothing. Verified by
#                    running the suite with the script denied.
#
# Adding `true` here is a security decision, not a way to clear a failed
# install. A new entry means a dependency started wanting to execute code on
# every machine that installs this project.
#
# A failed install over a missing entry does not just error -- it edits this
# file, merging a `<name>: set this to true or false` placeholder into the
# block below. Decide and replace that line; do not just re-run the install.
allowBuilds:
  leveldown: false
  '@parcel/watcher': false
  unrs-resolver: false

# Transitive dependencies must come from the registry -- no git repositories,
# no tarball URLs. This is pnpm's default; pinned so it survives a default flip.
blockExoticSubdeps: true

# Fail the install when a package's trust level drops relative to earlier
# releases (a maintainer losing 2FA, a publish from an unattested source).
trustPolicy: no-downgrade

# One exclusion, and it is a false positive rather than a waived risk.
# `semver@6.3.1` (2023-07-10) is a maintenance backport to the v6 line, published
# three days after `semver@7.5.4` (2023-07-07) -- which *does* carry a SLSA
# provenance attestation. Trust level is judged by publish date, not by semver
# line, so the older major looks like a regression from the newer one. Same
# repository (npm's own node-semver), same maintainers, and it reaches us only
# through the Babel toolchain, which is build-time-only. Pinned to the exact
# version so a genuinely regressed semver 6.x would still fail the install.
trustPolicyExclude:
  - 'semver@6.3.1'

# --- Overrides --------------------------------------------------------------
# The `uuid` entry keeps `pnpm audit` clean rather than fixing a live
# exposure; see docs/toolchain.md for why that advisory is not reachable here.
# Every other floor below fixes an actual advisory, pinned at the advisory's
# own first-patched version so the resolved version sitting above the floor is
# the `^` working, not a weaker guard. `js-yaml` is split per major because
# 4.x dropped `safeLoad`/`safeDump`, so 3.x consumers cannot cross, and this
# tree carries both lines. `brace-expansion` is split the same way across its
# 1.x/2.x/4.x lines, which minimatch's own major versions pull in separately.
#
# pnpm does not read npm's top-level `overrides` field, so these live here.
# Drop them and the advisories come back.
overrides:
  uuid: ^11.1.1
  'js-yaml@>=4.0.0 <4.3.2': ^5.0.0
  'js-yaml@<3.15.2': ^3.15.2
  # fast-uri (ajv, via webpack/css-loader/etc.): GHSA-hrr3-gc8f-f4qj,
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr -- host/scheme confusion and
  # case-normalization bugs, all patched by 3.1.9.
  'fast-uri@<3.1.9': ^3.1.9
  # brace-expansion (minimatch, via jest/@vue/test-utils): GHSA-q2hr-2g5m-vwhr,
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p -- ReDoS and stack-exhaustion DoS
  # via crafted brace patterns, each patched per major line below.
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': ^2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  # source-map-js (vue/postcss, everywhere): GHSA-68fv-2mgg-jv7q -- a crafted
  # indexed source-map section offset can hang the event loop, patched 1.2.2.
  'source-map-js@<1.2.2': ^1.2.2
  # shell-quote (web-ext>fx-runner, dev-only): GHSA-pqg4-j6r4-53mv -- `quote()`
  # command injection via a line terminator after a `{ comment }` token,
  # patched 1.11.0.
  'shell-quote@<1.11.0': ^1.11.0
  # undici (web-ext>addons-linter>cheerio, dev-only): GHSA-4qv8-2p9j-2685,
  # GHSA-f72v-6w45-q472, GHSA-xjj6-f33q-929c -- EventSource memory DoS, SRI
  # algorithm-case bypass, and unhandled-encoding DoS, all patched by 7.30.1.
  'undici@<7.30.1': ^7.30.1
  # serialize-javascript (copy-webpack-plugin): GHSA-m5mm-p8h7-m29v -- an
  # unescaped `</script` in a serialized function body can break out of the
  # surrounding tag, patched 7.1.3.
  'serialize-javascript@<7.1.3': ^7.1.3
  # web-ext's addons-linter/firefox-profile pull these in transitively.
  # image-size <=2.0.2 (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq): ICNS/JXL/HEIF
  # parsers allow a denial-of-service infinite loop, patched 2.0.3.
  'image-size@<=2.0.2': ^2.0.3
  # adm-zip <=0.6.0 (GHSA-vwc7-r8mq-g2x9): extraction follows destination
  # symlinks, allowing an arbitrary file overwrite, patched 0.6.1.
  'adm-zip@<=0.6.0': ^0.6.1
  # postcss-selector-parser (css-loader's postcss-modules-*): GHSA-rj75-hqrm-r3gf
  # -- quadratic complexity in flat selector parsing allows CPU exhaustion,
  # patched 7.1.6.
  'postcss-selector-parser@<7.1.6': ^7.1.6

auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
