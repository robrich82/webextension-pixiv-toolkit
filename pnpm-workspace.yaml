engineStrict: true

# --- Supply chain -----------------------------------------------------------
# Refuse packages published less than this many minutes ago. Caret ranges stop
# a plain install crossing a major, but they happily take a malicious patch the
# hour it lands -- which is the shape almost every compromised-maintainer
# incident has had. The window is a day, matching Renovate's cooldown. Set
# explicitly rather than inherited, so a future change to pnpm's default cannot
# quietly shorten it.
#
# A deliberate urgent security bump WILL appear to fail against this. The fix
# is `minimumReleaseAgeExclude`, not lowering the window further -- see
# docs/toolchain.md.
#
# Setting this at all also turns on `minimumReleaseAgeStrict` (pnpm's default
# when the key is present, even at a value equal to the default): if nothing
# in range is old enough, the install fails loudly instead of silently taking
# an immature version. That is the wanted behaviour; ordinary fall-back to an
# older mature version is unaffected.
minimumReleaseAge: 1440

# Lifecycle scripts are denied by default in pnpm, and pnpm fails the install
# outright if a package wants to build and this map does not mention it. So the
# allowlist is really a decision log: every package in the tree that declares an
# install script is named here, and every one of them is denied.
#
#   @parcel/watcher  native file watching for `sass --watch`. Unreachable --
#                    watching is webpack's job here.
#
# Adding `true` here is a security decision, not a way to clear a failed
# install. A new entry means a dependency started wanting to execute code on
# every machine that installs this project.
#
# A failed install over a missing entry does not just error -- it edits this
# file, merging a `<name>: set this to true or false` placeholder into the
# block below. Decide and replace that line; do not just re-run the install.
allowBuilds:
  '@parcel/watcher': false

# Transitive dependencies must come from the registry -- no git repositories,
# no tarball URLs. This is pnpm's default; pinned so it survives a default flip.
blockExoticSubdeps: true

# Fail the install when a package's trust level drops relative to earlier
# releases (a maintainer losing 2FA, a publish from an unattested source).
trustPolicy: no-downgrade

# Advisories `pnpm audit` should not report. Each entry needs a reason, and
# comes out once a fixed version exists.
#
# GHSA-gcqx-w48m-w2h4 (low): deepmerge <=4.3.1 lets `mergeObject()` return an
# object with a poisoned prototype. There is no patched release (4.3.1, from
# 2023, is the latest), and addons-linter still depends on it, so neither an
# update nor an `overrides` floor can clear it. It is dev-only: web-ext pulls
# it in, and nothing in dist/ ships it.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

# --- Overrides --------------------------------------------------------------
# An advisory floor stays only while resolving without it (no lockfile) lands
# on a vulnerable version. `pnpm audit` misses advisories published only on the
# package's own repo, so check those too. A floor sits at the advisory's first
# patched version; Renovate never moves one to a new major (renovate.json).
# pnpm ignores npm's top-level `overrides`.
overrides:
  # glob (js-beautify via @vue/test-utils; dev-only): GHSA-3g3m-2fjr-6pw4 --
  # AbortSignal cancellation bypass, patched 14.0.2.
  'glob@<14.0.2': ^14.0.2
  # minimatch (js-beautify>editorconfig, web-ext's multimatch 8;
  # dev-only): GHSA-g3hv-75wg-m249 -- DoS via globparts amplification, 11.0.1.
  'minimatch@<11.0.1': ^11.0.1
  # multimatch (web-ext): not an advisory. 6.x default-imports minimatch, which
  # v11 no longer exports, so `web-ext build` crashes (see docs/toolchain.md).
  'multimatch@<8': ^8.0.0

# multimatch 8 (web-ext) under minimatch 11 reads web-ext's Windows ignore
# patterns' backslashes as escapes, so nothing is ignored and dotfiles/zips get
# packed; the patch restores minimatch 3's backslash-as-separator on Windows.
patchedDependencies:
  multimatch: patches/multimatch.patch
